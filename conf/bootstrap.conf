# Meta-0（与 meta_peers 中首节点对应）
node_id=meta-0
listen_addr=0.0.0.0:8500
meta_addr=0.0.0.0:8500
data_dir=./data/meta-0
shard_count=8
replica_factor=3
raft_election_timeout_ms=1500
raft_heartbeat_ms=100
raft_compact_threshold=256
# Meta 3 副本：挂 1 台仍多数派可用，路由/注册强一致
meta_peers=meta-0@127.0.0.1:8500,meta-1@127.0.0.1:8501,meta-2@127.0.0.1:8502
# 前 replica_factor 个 = 在用 Active（托管 Region 0）；其余 = Joining 待加入（须 skv join / Web 加入）
storage_peers=storage-0@127.0.0.1:9100,storage-1@127.0.0.1:9101,storage-2@127.0.0.1:9102,storage-3@127.0.0.1:9103,storage-4@127.0.0.1:9104,storage-5@127.0.0.1:9105
compute_peers=compute-0@127.0.0.1:19000,compute-1@127.0.0.1:19001
