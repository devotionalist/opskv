apiVersion: v1
kind: Service
metadata:
  name: meta-headless
  namespace: {{ include "opskv.namespace" . }}
  labels:
    {{- include "opskv.labels" . | nindent 4 }}
    app.kubernetes.io/component: meta
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: meta
  ports:
    - name: grpc
      port: {{ .Values.ports.meta }}
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: meta
  namespace: {{ include "opskv.namespace" . }}
  labels:
    {{- include "opskv.labels" . | nindent 4 }}
    app.kubernetes.io/component: meta
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: meta
  ports:
    - name: grpc
      port: {{ .Values.ports.meta }}
      targetPort: grpc
