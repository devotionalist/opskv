apiVersion: v1
kind: Service
metadata:
  name: storage-headless
  namespace: {{ include "opskv.namespace" . }}
  labels:
    {{- include "opskv.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
  ports:
    - name: grpc
      port: {{ .Values.ports.storage }}
      targetPort: grpc
---
apiVersion: v1
kind: Service
metadata:
  name: storage
  namespace: {{ include "opskv.namespace" . }}
  labels:
    {{- include "opskv.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: storage
  ports:
    - name: grpc
      port: {{ .Values.ports.storage }}
      targetPort: grpc
