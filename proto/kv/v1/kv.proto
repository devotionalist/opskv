syntax = "proto3";

package kv.v1;

option go_package = "github.com/amydemo/opskv/client/go/gen/kv/v1;kvv1";
option cc_enable_arenas = true;

// 对外 KV API，由 Compute Proxy 提供
service KVService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc BatchGet(BatchGetRequest) returns (BatchGetResponse);
  rpc BatchPut(BatchPutRequest) returns (BatchPutResponse);
  rpc Watch(WatchRequest) returns (stream WatchEvent);

  // Percolator 乐观事务（无 SQL）
  rpc TxnBegin(TxnBeginRequest) returns (TxnBeginResponse);
  rpc TxnGet(TxnGetRequest) returns (TxnGetResponse);
  rpc TxnPrewrite(TxnPrewriteRequest) returns (TxnPrewriteResponse);
  rpc TxnCommit(TxnCommitRequest) returns (TxnCommitResponse);
  rpc TxnRollback(TxnRollbackRequest) returns (TxnRollbackResponse);
  rpc TxnPessimisticLock(TxnPessimisticLockRequest) returns (TxnPessimisticLockResponse);
  rpc TxnPessimisticRollback(TxnPessimisticRollbackRequest) returns (TxnPessimisticRollbackResponse);
  rpc TxnResolveLock(TxnResolveLockRequest) returns (TxnResolveLockResponse);
  rpc TxnCheckStatus(TxnCheckStatusRequest) returns (TxnCheckStatusResponse);
}

message GetRequest {
  bytes key = 1;
  // 是否要求线性一致读（仅 Leader）
  bool linearizable = 2;
}

message GetResponse {
  bytes value = 1;
  bool found = 2;
  uint64 revision = 3;
}

message PutRequest {
  bytes key = 1;
  bytes value = 2;
  int64 ttl_ms = 3;  // 0 = 永不过期
}

message PutResponse {
  uint64 revision = 1;
  bool ok = 2;
}

message DeleteRequest {
  bytes key = 1;
}

message DeleteResponse {
  bool deleted = 1;
  uint64 revision = 2;
}

message BatchGetRequest {
  repeated bytes keys = 1;
  bool linearizable = 2;
}

message BatchGetResponse {
  repeated GetResponse results = 1;
}

message KeyValue {
  bytes key = 1;
  bytes value = 2;
}

message BatchPutRequest {
  repeated KeyValue items = 1;
}

message BatchPutResponse {
  repeated PutResponse results = 1;
}

message WatchRequest {
  bytes key = 1;
  bytes key_prefix = 2;
  uint64 start_revision = 3;
}

message WatchEvent {
  enum Type {
    PUT = 0;
    DELETE = 1;
  }
  Type type = 1;
  bytes key = 2;
  bytes value = 3;
  uint64 revision = 4;
}

message TxnBeginRequest {
  uint32 count = 1;  // 预分配时间戳个数，默认 1
}

message TxnBeginResponse {
  uint64 start_ts = 1;
}

message TxnGetRequest {
  bytes key = 1;
  uint64 start_ts = 2;
}

message TxnGetResponse {
  bytes value = 1;
  bool found = 2;
  bool locked = 3;
}

message TxnMutation {
  bytes key = 1;
  bytes value = 2;
  bool is_delete = 3;
}

message TxnPrewriteRequest {
  uint64 start_ts = 1;
  bytes primary_key = 2;
  repeated TxnMutation mutations = 3;
}

message TxnPrewriteResponse {
  bool ok = 1;
  string error = 2;
}

message TxnCommitRequest {
  uint64 start_ts = 1;
  bytes primary_key = 2;
  repeated bytes keys = 3;  // 含 primary；先 commit primary 再 secondary
}

message TxnCommitResponse {
  bool ok = 1;
  uint64 commit_ts = 2;
  string error = 3;
}

message TxnRollbackRequest {
  uint64 start_ts = 1;
  repeated bytes keys = 2;
}

message TxnRollbackResponse {
  bool ok = 1;
  string error = 2;
}

message TxnPessimisticLockRequest {
  uint64 start_ts = 1;
  uint64 for_update_ts = 2;
  bytes primary_key = 3;
  repeated bytes keys = 4;
  uint64 ttl_ms = 5;
}

message TxnPessimisticLockResponse {
  bool ok = 1;
  string error = 2;
}

message TxnPessimisticRollbackRequest {
  uint64 start_ts = 1;
  repeated bytes keys = 2;
}

message TxnPessimisticRollbackResponse {
  bool ok = 1;
  string error = 2;
}

message TxnResolveLockRequest {
  bytes key = 1;
  uint64 start_ts = 2;
  uint64 commit_ts = 3;  // 0 = rollback
}

message TxnResolveLockResponse {
  bool ok = 1;
  string error = 2;
}

message TxnCheckStatusRequest {
  bytes primary_key = 1;
  uint64 lock_ts = 2;
}

message TxnCheckStatusResponse {
  string status = 1;  // locked|expired|committed|rolledback
  uint64 commit_ts = 2;
}
