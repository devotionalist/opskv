syntax = "proto3";

package storage.v1;

option go_package = "github.com/amydemo/opskv/client/go/gen/storage/v1;storagev1";
option cc_enable_arenas = true;

// Compute → Storage 内部 API（仅 Leader 接受写）
service StoreService {
  rpc Get(StoreGetRequest) returns (StoreGetResponse);
  rpc Propose(ProposeRequest) returns (ProposeResponse);
  rpc TransferLeadership(TransferRequest) returns (TransferResponse);
}

// Raft 节点间复制（gRPC）
service RaftService {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc RequestPreVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc InstallSnapshot(stream SnapshotChunk) returns (InstallSnapshotResponse);
}

// 运维 / Meta 编排（原 ADMIN_* 行协议）
service AdminService {
  rpc EnsureRegion(EnsureRegionRequest) returns (AdminSimpleResponse);
  rpc AddLearner(PeerOpRequest) returns (AdminSimpleResponse);
  rpc Promote(PeerOpRequest) returns (AdminSimpleResponse);
  rpc RemovePeer(PeerOpRequest) returns (AdminSimpleResponse);
  rpc DestroyRegion(DestroyRegionRequest) returns (AdminSimpleResponse);
  rpc PeerProgress(PeerOpRequest) returns (PeerProgressResponse);
  rpc TransferLeader(TransferRequest) returns (AdminSimpleResponse);
  rpc Campaign(CampaignRequest) returns (AdminSimpleResponse);
  rpc PlaceRegion(PlaceRegionRequest) returns (AdminSimpleResponse);
  rpc PrepareSplit(PrepareSplitRequest) returns (AdminSimpleResponse);
  rpc Split(SplitRequest) returns (AdminSimpleResponse);
  rpc Merge(MergeRequest) returns (AdminSimpleResponse);
  rpc SetEpoch(SetEpochRequest) returns (AdminSimpleResponse);
  rpc Checkpoint(CheckpointRequest) returns (AdminSimpleResponse);
  rpc RegionStats(RegionStatsRequest) returns (RegionStatsResponse);
  rpc Ping(PingRequest) returns (PingResponse);
  // 行协议桥：txn/watch/运维未单独建模的命令经此进同一 handle_line
  rpc ExecLine(ExecLineRequest) returns (ExecLineResponse);
}

message ExecLineRequest {
  string line = 1;
}

message ExecLineResponse {
  string body = 1;
}

message StoreGetRequest {
  uint32 shard_id = 1;
  bytes key = 2;
  bool linearizable = 3;
}

message StoreGetResponse {
  bytes value = 1;
  bool found = 2;
  uint64 revision = 3;
  bool is_leader = 4;
  string redirect_to = 5;
}

message ProposeRequest {
  uint32 shard_id = 1;
  enum Op {
    PUT = 0;
    DELETE = 1;
  }
  Op op = 2;
  bytes key = 3;
  bytes value = 4;
  int64 ttl_ms = 5;
  string client_id = 6;
  uint64 request_id = 7;
}

message ProposeResponse {
  bool ok = 1;
  uint64 revision = 2;
  string error = 3;
  string redirect_to = 4;
}

message TransferRequest {
  uint32 shard_id = 1;
  string target_peer = 2;
}

message TransferResponse {
  bool ok = 1;
  string error = 2;
  string redirect_to = 3;
}

// ---- Raft ----

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes data = 3;
}

message AppendEntriesRequest {
  uint32 shard_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated LogEntry entries = 6;
  uint64 leader_commit = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
}

message RequestVoteRequest {
  uint32 shard_id = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message SnapshotChunk {
  uint32 shard_id = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  uint64 offset = 6;
  bytes data = 7;
  bool done = 8;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool ok = 2;
  // 安装成功后的 match（通常 = last_included_index）；与行协议 OK SNAP … match 对齐。
  uint64 match_index = 3;
}

// ---- Admin ----

message RaftPeer {
  string node_id = 1;
  string address = 2;
  bool learner = 3;
}

message AdminSimpleResponse {
  bool ok = 1;
  string message = 2;
  string redirect_to = 3;
}

message EnsureRegionRequest {
  uint32 region_id = 1;
  repeated RaftPeer peers = 2;
}

message PeerOpRequest {
  uint32 region_id = 1;
  string node_id = 2;
  string address = 3;  // AddLearner 需要
}

message DestroyRegionRequest {
  uint32 region_id = 1;
}

message PeerProgressResponse {
  bool ok = 1;
  string message = 2;
  string redirect_to = 3;
  uint64 match_index = 4;
  uint64 commit_index = 5;
  uint64 last_index = 6;
  bool caught_up = 7;
  bool is_learner = 8;
}

message CampaignRequest {
  uint32 region_id = 1;
}

message PlaceRegionRequest {
  uint32 region_id = 1;
  repeated string desired_peers = 2;  // node_id 列表
}

message PrepareSplitRequest {
  uint32 left_region = 1;
  bytes split_key = 2;
}

message SplitRequest {
  uint32 left_region = 1;
  uint32 right_region = 2;
  bytes split_key = 3;
}

message MergeRequest {
  uint32 left_region = 1;
  uint32 right_region = 2;
}

message SetEpochRequest {
  uint32 region_id = 1;
  uint64 epoch = 2;
}

message CheckpointRequest {
  uint32 region_id = 1;
  string path = 2;  // 空则自动路径
}

message RegionStatsRequest {
  uint32 region_id = 1;
}

message RegionStatsResponse {
  bool ok = 1;
  string message = 2;
  uint64 key_count = 3;
  uint64 approx_bytes = 4;
  uint64 epoch = 5;
}

message PingRequest {}

message PingResponse {
  string message = 1;
}
